stages:
  - build
  - test
  - package
  - security
  - gate

workflow:
  name: '$CI_PIPELINE_SOURCE | $CI_COMMIT_REF_NAME'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"


variables:
  AST_ENABLE_MR_PIPELINES: "true"
  JAVA_IMAGE: "eclipse-temurin:21-jdk"
  RUNTIME_IMAGE: "eclipse-temurin:21-jre-alpine"
  GATE_IMAGE: "alpine:3.20"
  TRIVY_IMAGE: "aquasec/trivy:0.58.1"
  GATE_BLOCK_SEVERITIES: "high,critical"
  REQUIRE_INTEGRATION_TESTS: "false"
  SAST_EXCLUDED_ANALYZERS: "spotbugs"
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, build, .gradle, node_modules"
  SECRET_DETECTION_EXCLUDED_PATHS: "build, .gradle, tests"


include:

  - template: Security/SAST.gitlab-ci.yml

  - local: ci/base.yml
  - local: ci/build.yml
  - local: ci/test.yml
  - local: ci/package.yml
  - local: ci/security.yml
  - local: ci/gate.yml
